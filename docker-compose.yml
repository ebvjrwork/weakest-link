services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_PATH=/app/data/weakestlink.db
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD}
      - SESSION_SIGNING_KEY=${SESSION_SIGNING_KEY}
      - SECURE_COOKIES=true
    volumes:
      - dbdata:/app/data
    networks: [internal]
    # No published host port on purpose — only Caddy is internet-facing.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

networks:
  internal: {}

volumes:
  dbdata: {}
  caddy_data: {}
  caddy_config: {}
